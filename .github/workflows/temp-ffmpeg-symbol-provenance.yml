name: Temporary FFmpeg 6.1 media compatibility fixture
on:
  push:
    branches:
      - temp-framer-imf-localread-20260928
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Build benign aligned two-track fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          dpkg-query -W -f='\${Package}=\${Version}\n' ffmpeg libavcodec60 libavutil58
          python3 - <<'PY'
          from pathlib import Path
          import base64
          W,H=384,32
          Path('/tmp/frame.yuv').write_bytes(
              bytes([0x11])*(W*H)
              + bytes([0x22])*((W//2)*(H//2))
              + bytes([0x33])*((W//2)*(H//2))
          )
          t=''
          t += '='*((4-len(t)%4)%4)
          Path('/tmp/short80x8.tiff').write_bytes(base64.b64decode(t))
          PY
          ffmpeg -hide_banner -loglevel error -f rawvideo -pixel_format yuv420p -video_size 384x32 \
            -i /tmp/frame.yuv -frames:v 1 -c:v magicyuv /tmp/safe.mkv
          ffmpeg -hide_banner -loglevel error -i /tmp/safe.mkv -loop 1 -framerate 1 \
            -i /tmp/short80x8.tiff -t 1 -map 0:v:0 -map 1:v:0 \
            -c:v:0 copy -c:v:1 copy -tag:v:0 M8Y0 -tag:v:1 tiff \
            -movflags +faststart /tmp/sameinv384-ff61.mov
          echo '=== PROBE ==='
          ffprobe -hide_banner -loglevel error -show_streams -of compact /tmp/sameinv384-ff61.mov
          echo '=== HASH ==='
          sha256sum /tmp/sameinv384-ff61.mov
          echo '=== FIXTURE_BASE64_BEGIN ==='
          base64 -w0 /tmp/sameinv384-ff61.mov
          echo
          echo '=== FIXTURE_BASE64_END ==='
