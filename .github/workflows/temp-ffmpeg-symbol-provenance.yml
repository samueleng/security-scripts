name: Temporary exact sameinv allocator calibration
on:
  push:
    branches:
      - temp-framer-imf-localread-20260928
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Trace exact sameinv MagicYUV to TIFF allocator reuse
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg libavutil-dev gcc
          cat >/tmp/sameinv.b64 <<'B64'
          
          B64
          base64 -d /tmp/sameinv.b64 >/tmp/sameinv.mov
          ffprobe -v error -show_entries stream=index,codec_name,width,height,pix_fmt -of compact /tmp/sameinv.mov

          cat >/tmp/hook.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <libavutil/buffer.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stddef.h>
          #include <malloc.h>
          #include <unistd.h>
          #include <stdarg.h>
          #include <string.h>

          typedef struct LocalBuffer {
              uint8_t *data; size_t size; unsigned refcount; unsigned _pad;
              void (*free_cb)(void*, uint8_t*); void *opaque; int flags; int flags_internal;
          } LocalBuffer;
          typedef struct LocalEntry {
              uint8_t *data; void *opaque; void (*free_cb)(void*, uint8_t*);
              AVBufferPool *pool; struct LocalEntry *next; LocalBuffer buffer;
          } LocalEntry;

          static AVBufferRef *(*real_pool_get)(AVBufferPool *);
          static int (*real_pm)(void **,size_t,size_t);
          static void (*real_free)(void *);
          static __thread int busy;
          static unsigned long seq;
          static void *entries[256]; static size_t nentries;

          static void msg(const char *fmt, ...) {
              if (busy) return; busy=1;
              char b[1200]; va_list ap; va_start(ap,fmt);
              int n=vsnprintf(b,sizeof(b),fmt,ap); va_end(ap);
              if (n>0) write(2,b,(size_t)(n<(int)sizeof(b)?n:(int)sizeof(b)-1));
              busy=0;
          }
          static int entry_id(void *p){
              for(size_t i=0;i<nentries;i++) if(entries[i]==p) return (int)i;
              return -1;
          }
          AVBufferRef *av_buffer_pool_get(AVBufferPool *pool){
              if(!real_pool_get) real_pool_get=dlsym(RTLD_NEXT,"av_buffer_pool_get");
              AVBufferRef *r=real_pool_get(pool);
              if(r){
                  LocalBuffer *b=(LocalBuffer*)r->buffer;
                  LocalEntry *e=(LocalEntry*)b->opaque;
                  if(b->size<4096 && e && nentries<256){
                      int id=entry_id(e); if(id<0){id=(int)nentries;entries[nentries++]=e;}
                      msg("S%06lu POOL id=%d size=%zu data=%p buf=%p ref=%p entry=%p free=%p orig_free=%p pool=%p next=%p\n",
                          ++seq,id,b->size,b->data,b,r,e,b->free_cb,e->free_cb,e->pool,e->next);
                  }
              }
              return r;
          }
          int posix_memalign(void **m,size_t al,size_t sz){
              if(!real_pm) real_pm=dlsym(RTLD_NEXT,"posix_memalign");
              int rc=real_pm(m,al,sz);
              if(!busy && rc==0 && (sz==80 || sz==88 || sz==96 || sz==104 || sz==112))
                  msg("S%06lu ALLOC size=%zu align=%zu ptr=%p usable=%zu entry_id=%d\n",
                      ++seq,sz,al,*m,malloc_usable_size(*m),entry_id(*m));
              return rc;
          }
          void free(void *p){
              if(!real_free) real_free=dlsym(RTLD_NEXT,"free");
              if(!p){real_free(p);return;}
              int id=entry_id(p);
              size_t u=malloc_usable_size(p);
              if(!busy && (id>=0 || (u>=80 && u<=120))){
                  unsigned char *x=p; char hx[241]; size_t lim=u<80?u:80; int q=0;
                  for(size_t i=0;i<lim && q<(int)sizeof(hx)-4;i++) q+=snprintf(hx+q,sizeof(hx)-q,"%02x",x[i]);
                  msg("S%06lu FREE ptr=%p usable=%zu entry_id=%d first80=%s\n",++seq,p,u,id,hx);
              }
              real_free(p);
          }
          EOF
          gcc -O2 -fPIC -shared /tmp/hook.c -o /tmp/hook.so -ldl $(pkg-config --cflags --libs libavutil)

          echo '=== EXACT SAMEINV DECODE ==='
          LD_PRELOAD=/tmp/hook.so ffmpeg -threads 1 -loglevel error -ss 0 -i /tmp/sameinv.mov -map 0:1 -frames:v 1 -f rawvideo -pix_fmt gray /tmp/out.raw 2>/tmp/trace.log || true
          grep -E ' POOL | ALLOC size=80| ALLOC size=88| FREE .*entry_id=[0-9]+' /tmp/trace.log || true
          echo '=== PIXEL QWORDS ==='
          python3 - <<'PY'
          import struct
          b=open('/tmp/out.raw','rb').read()
          print('len',len(b))
          for y in range(0,len(b)//80):
              row=b[y*80:(y+1)*80]
              qs=[hex(struct.unpack_from('<Q',row,o)[0]) for o in range(0,80,8)]
              print('ROW',y,*qs)
          PY
