name: Temporary exact allocation symbol map
on:
  push:
    branches:
      - temp-framer-imf-localread-20260928
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve FFmpeg 6.1.1 allocation callers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg binutils wget
          D=/tmp/codec.ddeb
          wget -q 'https://ddebs.ubuntu.com/pool/universe/f/ffmpeg/libavcodec60-dbgsym_6.1.1-3ubuntu5_amd64.ddeb' -O "$D"
          mkdir -p /tmp/dbg
          dpkg-deb -x "$D" /tmp/dbg
          DBG="$(find /tmp/dbg -type f -name '*.debug' | head -n1)"
          echo "DBG=$DBG"
          for a in 0x7cf6b8 0x7d4258 0x2a8525 0x6bc1e0; do
            echo "=== $a ==="
            addr2line -f -C -e "$DBG" "$a" || true
            nm -an "$DBG" | awk -v x="$a" 'BEGIN{t=strtonum(x);best=-1} /^[0-9a-fA-F]+ [tTwW] /{v=strtonum("0x"$1); if(v<=t && v>best){best=v; line=$0}} END{print line}' || true
          done
