name: Temporary FFmpeg safe GDB calibration
on:
  push:
    branches:
      - temp-framer-imf-localread-20260928
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect benign 64x32 YUV420 JPEG2000 frame allocation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg gdb
          ffmpeg -v error -f lavfi -i color=c=black:s=64x32:r=1 -frames:v 1 -pix_fmt yuv420p -c:v jpeg2000 -f nut /tmp/safe.nut
          echo '=== SAFE INPUT ==='
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height -of compact /tmp/safe.nut
          echo '=== GDB ==='
          cat >/tmp/gdb.cmd <<'EOF'
          set pagination off
          set breakpoint pending on
          break av_buffer_pool_get
          commands
            silent
            printf "POOL_GET pool=%p\n", $rdi
            continue
          end
          run -v error -threads 1 -i /tmp/safe.nut -frames:v 1 -f null -
          quit
          EOF
          gdb -q -batch -x /tmp/gdb.cmd --args ffmpeg 2>&1 | grep -E 'POOL_GET|Program received|SIG'
