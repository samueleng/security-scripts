name: Temporary FFmpeg safe heap calibration
on:
  push:
    branches:
      - temp-framer-imf-localread-20260928
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Reproduce benign MagicYUV TIFF carrier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg build-essential python3
          cat > /tmp/sameinv.b64 <<'B64'

B64
          base64 -d /tmp/sameinv.b64 > /tmp/sameinv.mov
          echo '=== versions ==='
          ffmpeg -version | head -n 5
          ffprobe -v error -show_streams -of compact /tmp/sameinv.mov || true

          cat >/tmp/hook.c <<'C'
#define _GNU_SOURCE
#include <dlfcn.h>
#include <stdint.h>
#include <stdio.h>
#include <stdlib.h>
#include <pthread.h>
#include <stdatomic.h>

typedef struct AVBuffer AVBuffer;
typedef struct AVBufferRef { AVBuffer *buffer; uint8_t *data; size_t size; } AVBufferRef;
struct AVBuffer {
    uint8_t *data; size_t size; atomic_uint refcount;
    void (*free_cb)(void*,uint8_t*); void *opaque; int flags; int flags_internal;
};
static __thread int busy;
static int (*real_posix_memalign)(void **, size_t, size_t);
static void (*real_free)(void *);
static AVBufferRef *(*real_pool_get)(void *);
static void (*real_unref)(AVBufferRef **);

static void init_syms(void){
  if(!real_posix_memalign) real_posix_memalign=dlsym(RTLD_NEXT,"posix_memalign");
  if(!real_free) real_free=dlsym(RTLD_NEXT,"free");
  if(!real_pool_get) real_pool_get=dlsym(RTLD_NEXT,"av_buffer_pool_get");
  if(!real_unref) real_unref=dlsym(RTLD_NEXT,"av_buffer_unref");
}
int posix_memalign(void **p,size_t a,size_t n){
  init_syms(); int r=real_posix_memalign(p,a,n);
  if(!busy && r==0 && (n==80 || n==88 || n<2048)){ busy=1; fprintf(stderr,"PMEM n=%zu a=%zu p=%p\n",n,a,*p); busy=0; }
  return r;
}
void free(void *p){
  init_syms();
  if(!busy && p){ busy=1; fprintf(stderr,"FREE p=%p\n",p); busy=0; }
  real_free(p);
}
AVBufferRef *av_buffer_pool_get(void *pool){
  init_syms(); AVBufferRef *r=real_pool_get(pool);
  if(r && !busy){
    busy=1;
    struct AVBuffer *b=(struct AVBuffer*)r->buffer;
    fprintf(stderr,"POOLGET ref=%p buf=%p data=%p size=%zu free=%p opaque=%p\n",
      (void*)r,(void*)b,(void*)r->data,r->size,(void*)b->free_cb,b->opaque);
    busy=0;
  }
  return r;
}
void av_buffer_unref(AVBufferRef **pr){
  init_syms();
  if(pr && *pr && !busy){
    busy=1;
    AVBufferRef *r=*pr; struct AVBuffer *b=(struct AVBuffer*)r->buffer;
    fprintf(stderr,"UNREF ref=%p buf=%p data=%p size=%zu free=%p opaque=%p\n",
      (void*)r,(void*)b,(void*)r->data,r->size,(void*)b->free_cb,b->opaque);
    busy=0;
  }
  real_unref(pr);
}
C
          gcc -shared -fPIC -O0 -o /tmp/hook.so /tmp/hook.c -ldl -pthread

          echo '=== decode ==='
          set +e
          LD_PRELOAD=/tmp/hook.so ffmpeg -hide_banner -loglevel error -ss 0 -i /tmp/sameinv.mov -frames:v 1 -f image2pipe -vcodec png /tmp/out.png 2>/tmp/trace.log
          rc=$?
          set -e
          echo "ffmpeg_rc=$rc"
          echo '=== png ==='
          python3 - <<'PY'
import struct,zlib
p=open('/tmp/out.png','rb').read()
print('png_len',len(p), 'sig',p[:8].hex())
pos=8; dat=b''
while pos+12<=len(p):
    n=struct.unpack('>I',p[pos:pos+4])[0]; t=p[pos+4:pos+8]; d=p[pos+8:pos+8+n]
    if t==b'IHDR': print('IHDR',struct.unpack('>IIBBBBB',d))
    if t==b'IDAT': dat+=d
    pos+=12+n
if dat:
    raw=zlib.decompress(dat)
    print('scanline_len',len(raw),'first32',raw[:33].hex())
    if len(raw)>=9: print('qword0',hex(int.from_bytes(raw[1:9],'little')))
PY
          echo '=== pool/allocation trace filtered ==='
          grep -E 'POOLGET|UNREF|PMEM n=(80|88|5[0-9][0-9]|10[0-9][0-9]|11[0-9][0-9])' /tmp/trace.log | tail -n 300 || true
