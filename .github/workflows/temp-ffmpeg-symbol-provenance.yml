name: Temporary exact sameinv allocation caller calibration
on:
  push:
    branches:
      - temp-framer-imf-localread-20260928
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Identify intervening 88-byte allocation caller
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg libavutil-dev gcc libc6-dbg
          cat >/tmp/sameinv.b64 <<'B64'
          
          B64
          base64 -d /tmp/sameinv.b64 >/tmp/sameinv.mov

          cat >/tmp/hook.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <libavutil/buffer.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stddef.h>
          #include <malloc.h>
          #include <unistd.h>
          #include <stdarg.h>
          #include <string.h>
          #include <execinfo.h>

          typedef struct LocalBuffer {
              uint8_t *data; size_t size; unsigned refcount; unsigned _pad;
              void (*free_cb)(void*, uint8_t*); void *opaque; int flags; int flags_internal;
          } LocalBuffer;
          typedef struct LocalEntry {
              uint8_t *data; void *opaque; void (*free_cb)(void*, uint8_t*);
              AVBufferPool *pool; struct LocalEntry *next; LocalBuffer buffer;
          } LocalEntry;
          static AVBufferRef *(*real_pool_get)(AVBufferPool *);
          static int (*real_pm)(void **,size_t,size_t);
          static void (*real_free)(void *);
          static __thread int busy;
          static unsigned long seq;
          static void *entries[64]; static size_t nentries;
          static void msg(const char *fmt, ...) {
              if (busy) return; busy=1;
              char b[1500]; va_list ap; va_start(ap,fmt);
              int n=vsnprintf(b,sizeof(b),fmt,ap); va_end(ap);
              if(n>0) write(2,b,(size_t)(n<(int)sizeof(b)?n:(int)sizeof(b)-1));
              busy=0;
          }
          static int entry_id(void *p){for(size_t i=0;i<nentries;i++)if(entries[i]==p)return (int)i;return -1;}
          static void bt(const char *tag){
              if(busy)return; busy=1;
              void *a[16]; int n=backtrace(a,16);
              dprintf(2,"%s BACKTRACE n=%d\n",tag,n);
              backtrace_symbols_fd(a,n,2);
              busy=0;
          }
          AVBufferRef *av_buffer_pool_get(AVBufferPool *pool){
              if(!real_pool_get) real_pool_get=dlsym(RTLD_NEXT,"av_buffer_pool_get");
              AVBufferRef *r=real_pool_get(pool);
              if(r){
                  LocalBuffer *b=(LocalBuffer*)r->buffer; LocalEntry *e=(LocalEntry*)b->opaque;
                  if(b->size<4096 && e && nentries<64){
                      int id=entry_id(e); if(id<0){id=(int)nentries;entries[nentries++]=e;}
                      msg("S%06lu POOL id=%d size=%zu data=%p entry=%p free=%p orig_free=%p\n",
                          ++seq,id,b->size,b->data,e,b->free_cb,e->free_cb);
                  }
              }
              return r;
          }
          int posix_memalign(void **m,size_t al,size_t sz){
              if(!real_pm) real_pm=dlsym(RTLD_NEXT,"posix_memalign");
              int rc=real_pm(m,al,sz);
              if(!busy && rc==0 && (sz==80 || sz==88)){
                  int id=entry_id(*m);
                  msg("S%06lu ALLOC size=%zu ptr=%p usable=%zu entry_id=%d\n",++seq,sz,*m,malloc_usable_size(*m),id);
                  if(id>=0 || sz==80) bt(id>=0?"RECLAIM_ENTRY":"ALLOC80");
              }
              return rc;
          }
          void free(void *p){
              if(!real_free) real_free=dlsym(RTLD_NEXT,"free");
              if(!p){real_free(p);return;}
              int id=entry_id(p); size_t u=malloc_usable_size(p);
              if(!busy && id>=0){
                  unsigned char *x=p; char hx[193]; int q=0;
                  for(size_t i=0;i<64;i++)q+=snprintf(hx+q,sizeof(hx)-q,"%02x",x[i]);
                  msg("S%06lu FREE_ENTRY id=%d ptr=%p first64=%s\n",++seq,id,p,hx);
              }
              real_free(p);
          }
          EOF
          gcc -O2 -fPIC -shared /tmp/hook.c -o /tmp/hook.so -ldl -rdynamic $(pkg-config --cflags --libs libavutil)
          LD_PRELOAD=/tmp/hook.so ffmpeg -threads 1 -loglevel error -ss 0 -i /tmp/sameinv.mov -map 0:1 -frames:v 1 -f rawvideo -pix_fmt gray /tmp/out.raw 2>/tmp/trace.log || true
          cat /tmp/trace.log
