name: Temporary FFmpeg safe pool layout
on:
  push:
    branches:
      - temp-framer-imf-localread-20260928
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Measure benign FFmpeg YUV420 pool objects
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libavutil-dev gcc
          cat >/tmp/pool.c <<'EOF'
          #include <libavutil/buffer.h>
          #include <libavutil/mem.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stddef.h>
          #include <malloc.h>

          typedef struct LocalBuffer {
              uint8_t *data;
              size_t size;
              unsigned refcount;
              unsigned _pad;
              void (*free_cb)(void*, uint8_t*);
              void *opaque;
              int flags;
              int flags_internal;
          } LocalBuffer;

          typedef struct LocalEntry {
              uint8_t *data;
              void *opaque;
              void (*free_cb)(void*, uint8_t*);
              AVBufferPool *pool;
              struct LocalEntry *next;
              LocalBuffer buffer;
          } LocalEntry;

          static void show(const char *name, AVBufferRef *r) {
              LocalBuffer *b=(LocalBuffer*)r->buffer;
              LocalEntry *e=(LocalEntry*)b->opaque;
              printf("%s ref=%p buf=%p data=%p req=%zu usable=%zu free=%p entry=%p\n",
                     name,(void*)r,(void*)b,(void*)b->data,b->size,
                     malloc_usable_size(b->data),(void*)b->free_cb,(void*)e);
              printf("%s entry_fields data=%p opaque=%p orig_free=%p pool=%p next=%p embedded_buf=%p\n",
                     name,(void*)e->data,e->opaque,(void*)e->free_cb,(void*)e->pool,
                     (void*)e->next,(void*)&e->buffer);
              printf("%s deltas data_to_ref=%td data_to_buf=%td data_to_entry=%td data_end_to_entry=%td data_end_to_buf=%td\n",
                     name,(char*)r-(char*)b->data,(char*)b-(char*)b->data,(char*)e-(char*)b->data,
                     (char*)e-((char*)b->data+b->size),(char*)b-((char*)b->data+b->size));
          }

          int main(void) {
              printf("sizeof LocalBuffer=%zu LocalEntry=%zu AVBufferRef=%zu\n",
                     sizeof(LocalBuffer),sizeof(LocalEntry),sizeof(AVBufferRef));
              AVBufferPool *py=av_buffer_pool_init(2127,av_buffer_allocz);
              AVBufferPool *pu=av_buffer_pool_init(1103,av_buffer_allocz);
              AVBufferPool *pv=av_buffer_pool_init(1103,av_buffer_allocz);
              AVBufferRef *y=av_buffer_pool_get(py);
              AVBufferRef *u=av_buffer_pool_get(pu);
              AVBufferRef *v=av_buffer_pool_get(pv);
              show("Y",y); show("U",u); show("V",v);
              av_buffer_unref(&y); av_buffer_unref(&u); av_buffer_unref(&v);
              av_buffer_pool_uninit(&py); av_buffer_pool_uninit(&pu); av_buffer_pool_uninit(&pv);
              return 0;
          }
          EOF
          gcc -O0 -g /tmp/pool.c -o /tmp/pool $(pkg-config --cflags --libs libavutil)
          dpkg-query -W -f='\${Package}=\${Version}\n' libavutil58 libc6
          /tmp/pool
